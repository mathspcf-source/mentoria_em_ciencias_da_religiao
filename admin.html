<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ... estilos existentes ... */
        
        /* Novos estilos para gráficos */
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 4px;
        }
        
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 18px;
        }
        
        .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .plan-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .plan-badge.mensal { background: #dbeafe; color: #2563eb; }
        .plan-badge.trimestral { background: #d1fae5; color: #059669; }
        .plan-badge.semestral { background: #fef3c7; color: #d97706; }
        .plan-badge.anual { background: #fce4ec; color: #dc2626; }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-indicator.active { background: #10b981; }
        .status-indicator.inactive { background: #ef4444; }
        
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<!-- MODAL PLANO (CORRIGIDO) -->
<div id="modalPlano" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="planoModalTitle">Novo Plano</h3>
            <button class="modal-close" onclick="fecharModal('Plano')">&times;</button>
        </div>
        <form id="formPlano" onsubmit="salvarPlano(event)">
            <input type="hidden" id="planoId">
            <div class="form-group">
                <label>Nome do Plano</label>
                <input type="text" id="planoNome" required>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="planoDescricao" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Valor R$</label>
                    <input type="number" id="planoValor" required step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>Frequência</label>
                    <select id="planoFrequencia" required>
                        <option value="mensal">Mensal</option>
                        <option value="trimestral">Trimestral</option>
                        <option value="semestral">Semestral</option>
                        <option value="anual">Anual</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="planoStatus">
                    <option value="true">Ativo</option>
                    <option value="false">Inativo</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-full">Salvar Plano</button>
        </form>
    </div>
</div>

(function() {

    try {
        const s = JSON.parse(d);
        if (Date.now() - s.timestamp > SESSION_DURATION) {

function toast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

async function carregarSelectProfessores(selectId = 'turmaProfessor') {
    try {
        const select = document.getElementById(selectId);
        if (!select) return;
        
        select.innerHTML = '<option value="">⏳ Carregando...</option>';
        const { data, error } = await sb.from('professores').select('*').eq('ativo', true);
        
        if (error) throw error;
        
        select.innerHTML = '<option value="">Selecione um professor</option>';
        if (data && data.length > 0) {
            data.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
            });
        } else {
            select.innerHTML = '<option value="">📭 Nenhum professor disponível</option>';
        }
    } catch (error) {
        console.error('❌ Erro ao carregar professores:', error);
        document.getElementById(selectId).innerHTML = '<option value="">⚠️ Erro ao carregar</option>';
    }
}

            select.innerHTML = '<option value="">⚠️ Erro ao carregar</option>';

// ============================================================
//  DASHBOARD COM CACHE E GRÁFICOS
// ============================================================
async function carregarDashboard() {
    try {
        showLoading();
        
        // Verificar cache
        const now = Date.now();
        if (dashboardCache.data && (now - dashboardCache.timestamp) < CACHE_DURATION) {
            console.log('📦 Usando cache do dashboard');
            atualizarDashboardUI(dashboardCache.data);
            hideLoading();
            return dashboardCache.data;
        }

        console.log('🔄 Buscando dados do dashboard...');
        
        const [professores, alunos, turmas, pendentes, trabalhos, pagamentos] = await Promise.all([
            sb.from('professores').select('id', { count: 'exact', head: true }).eq('ativo', true),
            sb.from('alunos').select('id', { count: 'exact', head: true }).eq('ativo', true),
            sb.from('turmas').select('id', { count: 'exact', head: true }).eq('ativo', true),
            sb.from('pagamentos').select('id', { count: 'exact', head: true }).eq('status', 'pendente'),
            sb.from('trabalhos').select('id, aluno_id, status'),
            sb.from('pagamentos').select('status')
        ]);

        const stats = {
            professores: professores.count || 0,
            alunos: alunos.count || 0,
            turmas: turmas.count || 0,
            pendentes: pendentes.count || 0
        };

        // Dados para gráficos
        const trabalhosData = trabalhos.data || [];
        const pagamentosData = pagamentos.data || [];
        
        const trabalhosPorStatus = {
            aguardando: trabalhosData.filter(t => t.status === 'aguardando').length,
            devolvido: trabalhosData.filter(t => t.status === 'devolvido').length
        };

        const pagamentosPorStatus = {
            pago: pagamentosData.filter(p => p.status === 'pago').length,
            pendente: pagamentosData.filter(p => p.status === 'pendente').length
        };

        const dashboardData = {
            stats,
            trabalhosPorStatus,
            pagamentosPorStatus
        };

        // Atualizar cache
        dashboardCache.data = dashboardData;
        dashboardCache.timestamp = now;

        atualizarDashboardUI(dashboardData);
        hideLoading();
        return dashboardData;
    } catch (error) {
        console.error('Erro ao carregar dashboard:', error);
        hideLoading();
        return { stats: { professores: 0, alunos: 0, turmas: 0, pendentes: 0 } };
    }
}

function atualizarDashboardUI(data) {
    const { stats, trabalhosPorStatus, pagamentosPorStatus } = data;
    
    document.getElementById('totalProfessores').textContent = stats.professores;
    document.getElementById('totalAlunos').textContent = stats.alunos;
    document.getElementById('totalTurmas').textContent = stats.turmas;
    document.getElementById('totalPendentes').textContent = stats.pendentes;
    document.getElementById('pendentesBadge').textContent = stats.pendentes;
    
    // Renderizar gráficos
    renderizarGraficos(trabalhosPorStatus, pagamentosPorStatus);
}

// ============================================================
//  GRÁFICOS
// ============================================================
let chartInstances = {};

function renderizarGraficos(trabalhosPorStatus, pagamentosPorStatus) {
    // Gráfico de Trabalhos
    const ctxTrabalhos = document.getElementById('chartTrabalhos');
    if (ctxTrabalhos) {
        if (chartInstances.trabalhos) {
            chartInstances.trabalhos.destroy();
        }
        chartInstances.trabalhos = new Chart(ctxTrabalhos, {
            type: 'doughnut',
            data: {
                labels: ['Aguardando', 'Devolvidos'],
                datasets: [{
                    data: [trabalhosPorStatus.aguardando, trabalhosPorStatus.devolvido],
                    backgroundColor: ['#f59e0b', '#10b981'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 12,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    }
                }
            }
        });
    }

    // Gráfico de Pagamentos
    const ctxPagamentos = document.getElementById('chartPagamentos');
    if (ctxPagamentos) {
        if (chartInstances.pagamentos) {
            chartInstances.pagamentos.destroy();
        }
        chartInstances.pagamentos = new Chart(ctxPagamentos, {
            type: 'doughnut',
            data: {
                labels: ['Pagos', 'Pendentes'],
                datasets: [{
                    data: [pagamentosPorStatus.pago, pagamentosPorStatus.pendente],
                    backgroundColor: ['#10b981', '#ef4444'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 12,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    }
                }
            }
        });
    }
}

//  TABELAS COM EDIÇÃO

async function carregarTabelas() {
    try {
        showLoading();
        const [professores, alunos, turmas, pagamentos, planos] = await Promise.all([
            sb.from('professores').select('*').eq('ativo', true),
            sb.from('alunos').select('*').eq('ativo', true),
            sb.from('turmas').select('*').eq('ativo', true),
            sb.from('pagamentos').select('*'),
            sb.from('planos').select('*')
        ]);

        const profData = professores.data || [];
        const alunosData = alunos.data || [];
        const turmasData = turmas.data || [];
        const pagamentosData = pagamentos.data || [];
        const planosData = planos.data || [];

        const planosMap = {};
        planosData.forEach(p => planosMap[p.id] = p.nome);

        // Professores
        const tabelaProf = document.getElementById('tabelaProfessores');
        if (profData.length === 0) {
            tabelaProf.innerHTML = '<tr><td colspan="4"><div class="empty-state">Nenhum professor cadastrado</div></td></tr>';
        } else {
            tabelaProf.innerHTML = profData.map(p => `
                <tr>
                    <td><strong>${p.nome}</strong></td>
                    <td>${p.email}</td>
                    <td>${p.especialidade || '-'}</td>
                    <td style="text-align:right">
                        <div class="card-actions" style="justify-content:flex-end">
                            <button class="btn btn-outline btn-xs" onclick="editarProfessor('${p.id}')">✏️</button>
                            <button class="btn btn-danger btn-xs" onclick="desativarProfessor('${p.id}')">Desativar</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Alunos
        const tabelaAlunos = document.getElementById('tabelaAlunos');
        if (alunosData.length === 0) {
            tabelaAlunos.innerHTML = '<tr><td colspan="5"><div class="empty-state">Nenhum aluno cadastrado</div></td></tr>';
        } else {
            tabelaAlunos.innerHTML = alunosData.map(a => {
                const turma = turmasData.find(t => t.id === a.turma_id);
                const pagamento = pagamentosData.find(p => p.aluno_id === a.id);
                const status = pagamento ? (pagamento.status === 'pago' ? 
                    '<span class="badge badge-success">Pago</span>' : 
                    '<span class="badge badge-warning">Pendente</span>') : '-';
                return `
                    <tr>
                        <td><strong>${a.nome}</strong></td>
                        <td>${a.email}</td>
                        <td>${turma ? turma.nome : '-'}</td>
                        <td>${status}</td>
                        <td style="text-align:right">
                            <div class="card-actions" style="justify-content:flex-end">
                                <button class="btn btn-outline btn-xs" onclick="editarAluno('${a.id}')">✏️</button>
                                <button class="btn btn-danger btn-xs" onclick="desativarAluno('${a.id}')">Desativar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Turmas
        const tabelaTurmas = document.getElementById('tabelaTurmas');
        if (turmasData.length === 0) {
            tabelaTurmas.innerHTML = '<tr><td colspan="6"><div class="empty-state">Nenhuma turma criada</div></td></tr>';
        } else {
            tabelaTurmas.innerHTML = turmasData.map(t => {
                const professor = profData.find(p => p.id === t.professor_id);
                const qtd = alunosData.filter(a => a.turma_id === t.id).length;
                return `
                    <tr>
                        <td><strong>${t.nome}</strong></td>
                        <td>${professor ? professor.nome : '-'}</td>
                        <td>${qtd}</td>
                        <td>R$ ${Number(t.valor).toFixed(2)}</td>
                        <td>${planosMap[t.plano_id] || '-'}</td>
                        <td style="text-align:right">
                            <div class="card-actions" style="justify-content:flex-end">
                                <button class="btn btn-outline btn-xs" onclick="editarTurma('${t.id}')">✏️</button>
                                <button class="btn btn-danger btn-xs" onclick="desativarTurma('${t.id}')">Desativar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Planos
        const tabelaPlanos = document.getElementById('tabelaPlanos');
        if (planosData.length === 0) {
            tabelaPlanos.innerHTML = '<tr><td colspan="5"><div class="empty-state">Nenhum plano cadastrado</div></td></tr>';
        } else {
            tabelaPlanos.innerHTML = planosData.map(p => {
                const statusClass = p.ativo ? 'active' : 'inactive';
                const statusText = p.ativo ? 'Ativo' : 'Inativo';
                const freqClass = p.frequencia || 'mensal';
                return `
                    <tr>
                        <td><strong>${p.nome}</strong></td>
                        <td>${p.descricao || '-'}</td>
                        <td>R$ ${Number(p.valor).toFixed(2)}</td>
                        <td><span class="plan-badge ${freqClass}">${p.frequencia || 'Mensal'}</span></td>
                        <td>
                            <span class="status-indicator ${statusClass}"></span>
                            ${statusText}
                        </td>
                        <td style="text-align:right">
                            <div class="card-actions" style="justify-content:flex-end">
                                <button class="btn btn-outline btn-xs" onclick="editarPlano('${p.id}')">✏️</button>
                                ${p.ativo ? 
                                    `<button class="btn btn-danger btn-xs" onclick="togglePlano('${p.id}', false)">Desativar</button>` :
                                    `<button class="btn btn-success btn-xs" onclick="togglePlano('${p.id}', true)">Ativar</button>`
                                }
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Pagamentos
        const tabelaFinanceiro = document.getElementById('tabelaFinanceiro');
        if (pagamentosData.length === 0) {
            tabelaFinanceiro.innerHTML = '<tr><td colspan="6"><div class="empty-state">Nenhum pagamento registrado</div></td></tr>';
        } else {
            const alunoMap = {};
            alunosData.forEach(a => alunoMap[a.id] = a.nome);

            tabelaFinanceiro.innerHTML = pagamentosData.map(p => {
                const status = p.status === 'pago' ? 
                    '<span class="badge badge-success">Pago</span>' : 
                    '<span class="badge badge-warning">Pendente</span>';
                const btn = p.status === 'pendente' ? 
                    `<button class="btn btn-success btn-xs" onclick="confirmarPagamento('${p.id}')">Confirmar</button>` : '';
                return `
                    <tr>
                        <td>${alunoMap[p.aluno_id] || '-'}</td>
                        <td>${planosMap[p.plano_id] || '-'}</td>
                        <td>R$ ${Number(p.valor).toFixed(2)}</td>
                        <td>${p.vencimento}</td>
                        <td>${status}</td>
                        <td style="text-align:right">${btn}</td>
                    </tr>
                `;
            }).join('');
        }

        hideLoading();
    } catch (error) {
        console.error('Erro ao carregar tabelas:', error);
        hideLoading();
    }
}

async function carregarBiblioteca() {
    try {
        showLoading();
        const { data, error } = await sb.from('biblioteca').select('*').order('created_at', { ascending: false });
        const grid = document.getElementById('gridBiblioteca');
        
        if (error) throw error;
        
        if (!data || data.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><br>Nenhum material disponível</div>';
            hideLoading();
            return;
        }

        const artigos = data.filter(b => b.tipo === 'artigo');
        const livros = data.filter(b => b.tipo === 'livro');
        let html = '';

        if (livros.length > 0) {
            html += `<div style="grid-column:1/-1;margin-top:4px"><h3 style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px">📚 Livros</h3></div>`;
            html += livros.map(b => `
                <div class="bib-item bib-livro">
                    <div class="bib-tipo-badge livro">Livro</div>
                    <h4>${b.titulo}</h4>
                    <p>${b.descricao || ''}</p>
                    <a href="${b.link}" target="_blank">Acessar Material</a>
                    <div class="bib-actions">
                        <button class="btn btn-outline btn-xs" onclick="editarMaterial('${b.id}')">✏️</button>
                        <button class="btn btn-danger btn-xs" onclick="removerMaterial('${b.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        if (artigos.length > 0) {
            html += `<div style="grid-column:1/-1;margin-top:8px"><h3 style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px">📄 Artigos</h3></div>`;
            html += artigos.map(b => `
                <div class="bib-item bib-artigo">
                    <div class="bib-tipo-badge artigo">Artigo</div>
                    <h4>${b.titulo}</h4>
                    <p>${b.descricao || ''}</p>
                    <a href="${b.link}" target="_blank">Acessar Material</a>
                    <div class="bib-actions">
                        <button class="btn btn-outline btn-xs" onclick="editarMaterial('${b.id}')">✏️</button>
                        <button class="btn btn-danger btn-xs" onclick="removerMaterial('${b.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        grid.innerHTML = html;
        hideLoading();
    } catch (error) {
        console.error('Erro ao carregar biblioteca:', error);
        hideLoading();
    }
}

    const titulo = document.getElementById('bibNome').value.trim();
    const descricao = document.getElementById('bibDescricao').value.trim();
    const link = document.getElementById('bibLink').value.trim();

    if (!tipo || !titulo || !descricao || !link) {
        toast('Preencha todos os campos.');
        return;
    }

    try {
        showLoading();
        const dados = { tipo, titulo, descricao, link };
        
        if (id) {
            const { error } = await sb.from('biblioteca').update(dados).eq('id', id);
            if (error) throw error;
            toast('✅ Material atualizado!');
        } else {
            dados.id = uid();
            const { error } = await sb.from('biblioteca').insert(dados);
            if (error) throw error;
            toast('✅ Material adicionado!');
        }

        hideLoading();
        fecharModal('Biblioteca');
        document.getElementById('formBiblioteca').reset();
        document.getElementById('bibId').value = '';
        document.getElementById('bibModalTitle').textContent = 'Adicionar Material';
        carregarBiblioteca();
    } catch (error) {
        console.error('Erro ao salvar material:', error);
        hideLoading();
        toast('❌ Erro ao salvar material');
    }
}

async function carregarPerfil() {
    try {
        const { data, error } = await sb.from('fotos_perfil').select('foto_base64').eq('user_key', 'admin').single();
        const avatar = document.getElementById('adminAvatar');
        const sidebarAvatar = document.getElementById('sidebarAvatar');

            avatar.innerHTML = `<img src="${data.foto_base64}" style="width:100%;height:100%;object-fit:cover">`;
            sidebarAvatar.innerHTML = `<img src="${data.foto_base64}" style="width:100%;height:100%;object-fit:cover">`;
        }

    }

async function atualizarFoto() {
    const file = document.getElementById('adminPhoto').files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            showLoading();
            const { error } = await sb.from('fotos_perfil').upsert({
                id: uid(),
                user_key: 'admin',
                foto_base64: e.target.result
            }, { onConflict: 'user_key' });
            if (error) throw error;
            hideLoading();
            carregarPerfil();
            toast('✅ Foto atualizada!');
        } catch (error) {
            console.error('Erro ao atualizar foto:', error);
            hideLoading();
            toast('❌ Erro ao atualizar foto');
        }
    };
    reader.readAsDataURL(file);
}

async function salvarPerfil() {
    const senha = document.getElementById('adminSenha').value.trim();
    if (!senha) {
        toast('Digite uma nova senha.');
        return;
    }

    try {
        showLoading();
        const { error } = await sb.from('configuracoes').upsert({
            chave: 'admin_senha',
            valor: senha
        }, { onConflict: 'chave' });
        if (error) throw error;
        hideLoading();
        document.getElementById('adminSenha').value = '';
        toast('✅ Senha alterada com sucesso!');
    } catch (error) {
        console.error('Erro ao salvar perfil:', error);
        hideLoading();
        toast('❌ Erro ao alterar senha');

}

// ============================================================
//  BACKUP
// ============================================================
async function exportarBackup() {
    try {
        showLoading();
        const tabelas = ['configuracoes', 'planos', 'professores', 'turmas', 'alunos', 'encontros', 'trabalhos', 'pagamentos', 'biblioteca', 'fotos_perfil'];
        const backup = {};

        for (const tabela of tabelas) {
            const { data, error } = await sb.from(tabela).select('*');
            if (error) throw error;
            backup[tabela] = data || [];
        }

        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `mentorcr_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        hideLoading();
        toast('✅ Backup exportado!');
    } catch (error) {
        console.error('Erro ao exportar backup:', error);
        hideLoading();
        toast('❌ Erro ao exportar backup');
    }
}

function restaurarBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (!confirm('Restaurar backup? Os dados atuais serão SUBSTITUÍDOS.')) {
        event.target.value = '';
        return;
    }

    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            showLoading();
            const dados = JSON.parse(e.target.result);
            const ordem = ['configuracoes', 'planos', 'fotos_perfil', 'biblioteca', 'pagamentos', 'trabalhos', 'encontros', 'alunos', 'turmas', 'professores'];

            for (const tabela of ordem) {
                try {
                    await sb.from(tabela).delete().neq('id', '0');
                } catch (err) {}

                if (dados[tabela]) {
                    for (const registro of dados[tabela]) {
                        try {
                            await sb.from(tabela).insert(registro);
                        } catch (err) {}
                    }
                }
            }

            hideLoading();
            toast('✅ Backup restaurado com sucesso!');
            carregarDashboard();
            carregarTabelas();
        } catch (error) {
            console.error('Erro ao restaurar backup:', error);
            hideLoading();
            alert('❌ Erro ao restaurar backup. Verifique o arquivo.');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

async function apagarTudo() {
    if (!confirm('ATENÇÃO! Apagará TODOS os dados permanentemente.')) return;
    if (!confirm('CONFIRMAÇÃO FINAL: Todos os dados serão perdidos.')) return;

    try {
        showLoading();
        const ordem = ['fotos_perfil', 'biblioteca', 'pagamentos', 'trabalhos', 'encontros', 'alunos', 'turmas', 'professores', 'planos'];

        for (const tabela of ordem) {
            try {
                await sb.from(tabela).delete().neq('id', '0');
            } catch (err) {}
        }

        await sb.from('configuracoes').upsert({ chave: 'admin_senha', valor: 'admin123' }, { onConflict: 'chave' });
        hideLoading();
        toast('✅ Todos os dados foram apagados!');
        carregarDashboard();
        carregarTabelas();
    } catch (error) {
        console.error('Erro ao apagar dados:', error);
        hideLoading();
        toast('❌ Erro ao apagar dados');
    }
}
